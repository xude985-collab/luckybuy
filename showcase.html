<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晒单详情 · 幸运购</title>
  <link rel="stylesheet" href="css/style.css?v=31">

  <style>
    /* 默认状态：已登录（假设用户已登录，避免闪烁） */
    .nav-profile, .nav-admin { display: inline-block; }
    #topbar-wallet, #topbar-user { display: inline-block; }
    #topbar-login { display: none; }

    /* 未登录状态：由 JS 添加 not-logged-in 类来切换 */
    html.not-logged-in .nav-profile,
    html.not-logged-in .nav-admin { display: none; }
    html.not-logged-in #topbar-wallet,
    html.not-logged-in #topbar-user { display: none; }
    html.not-logged-in #topbar-login { display: inline-block; }

    /* 管理员状态：显示后台按钮 */
    html.user-is-admin .nav-admin { display: inline-block; }

    .sc-detail { max-width:1080px; margin:0 auto; padding:20px }
    .sc-media { width:100%; border-radius:12px; overflow:hidden; background:#000; text-align:center; margin-bottom:20px }
    .sc-media img { width:100%; max-height:70vh; object-fit:contain }
    .sc-media video { width:100%; max-height:70vh }
    .sc-info { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:20px }
    .sc-product { display:flex; align-items:center; gap:10px; margin-bottom:12px }
    .sc-product .emoji { font-size:32px }
    .sc-product .name { font-size:18px; font-weight:700 }
    .sc-caption { font-size:16px; line-height:1.8; color:#444; margin-bottom:16px; white-space:pre-wrap }
    .sc-bottom { display:flex; align-items:center; justify-content:space-between }
    .sc-meta { font-size:13px; color:var(--muted) }
    .like-btn {
      display:flex; align-items:center; gap:6px; background:none; border:1px solid #e0e0e0;
      border-radius:20px; padding:8px 18px; font-size:16px; cursor:pointer; transition:all .2s;
    }
    .like-btn:hover { border-color:var(--brand); background:#fff5f2 }
    .like-btn.liked { border-color:#e74c3c; background:#fff0ee }
    .like-count { font-size:15px; font-weight:600; color:#555 }
    .like-btn.liked .like-count { color:#e74c3c }
  </style>
</head>
<body>
  <header id="topbar" class="topbar"><a href="index.html" class="logo">Lucky&nbsp;Buy</a><nav><a href="index.html">全部商品</a><a href="winners.html">幸运区</a><a href="orders.html">我的记录</a><a href="rules.html">规则</a><a href="profile.html" class="nav-profile">个人中心</a><a href="admin.html" class="nav-admin">后台</a></nav><div class="spacer"></div><div class="wallet" id="topbar-wallet"></div><div class="wallet wallet-user" id="topbar-user"></div><a href="login.html" class="wallet" id="topbar-login">登录 / 注册</a></header>
  <div class="sc-detail">
    <a href="index.html" class="btn ghost" style="margin-bottom:16px">← 返回首页</a>
    <div id="sc-content"><div class="empty">加载中...</div></div>
  </div>
  <script src="js/common.js?v=40"></script>
  <script src="js/store.js?v=31"></script>
  <script src="js/showcase.js?v=31"></script>
</body>
</html>
