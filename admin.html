<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台管理 · Lucky Buy</title>
  <link rel="stylesheet" href="css/style.css?v=26">
  <link rel="stylesheet" href="css/admin.css?v=26">
  <script>
    // 防止登录状态闪烁：在 HTML 渲染前从 cookie 读取登录状态并立即应用样式
    (function() {
      try {
        const loggedIn = document.cookie.split('; ').find(r => r.startsWith('lb_logged_in='));
        if (loggedIn) {
          // 立即添加 style 标签，确保样式和类同时生效
          const style = document.createElement('style');
          style.textContent = '.nav-profile,.nav-admin{display:inline-block!important}#topbar-wallet,#topbar-user{display:inline-block!important}#topbar-login{display:none!important}';
          document.head.appendChild(style);
          // 添加类（配合后续的 CSS 规则）
          document.documentElement.classList.add('user-logged-in');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* 默认状态：未登录 */
    .nav-profile, .nav-admin { display: none; }
    #topbar-wallet, #topbar-user { display: none; }
    #topbar-login { display: inline-block; }

    /* 已登录状态：显示个人中心，隐藏登录按钮 */
    html.user-logged-in .nav-profile { display: inline-block; }
    html.user-logged-in #topbar-wallet { display: inline-block; }
    html.user-logged-in #topbar-user { display: inline-block; }
    html.user-logged-in #topbar-login { display: none; }

    /* 管理员状态：显示后台按钮 */
    html.user-is-admin .nav-admin { display: inline-block; }
  </style>
</head>
<body>
  <header id="topbar" class="topbar"><a href="index.html" class="logo">Lucky&nbsp;Buy</a><nav><a href="index.html">全部商品</a><a href="winners.html">幸运区</a><a href="orders.html">我的记录</a><a href="rules.html">规则</a><a href="profile.html" style="display:none" class="nav-profile">个人中心</a><a href="admin.html" style="display:none" class="nav-admin">后台</a></nav><div class="spacer"></div><div class="wallet" style="display:none" id="topbar-wallet"></div><div class="wallet wallet-user" style="display:none" id="topbar-user"></div><a href="login.html" class="wallet" id="topbar-login">登录 / 注册</a></header>
  <main class="container">
    <div class="page-title">后台管理</div>
    <nav class="admin-tabs">
      <button class="tab active" data-tab="dashboard">数据概览</button>
      <button class="tab" data-tab="products">商品管理</button>
      <button class="tab" data-tab="users">用户管理</button>
      <button class="tab" data-tab="showcase">晒单审核</button>
      <button class="tab" data-tab="wins">中奖订单</button>
      <button class="tab" data-tab="settings">系统设置</button>
    </nav>

    <!-- Tab: 数据概览 -->
    <section id="tab-dashboard" class="tab-panel active">
      <div class="stats-grid">
        <div class="stat-card"><span id="stat-users">0</span><label>注册用户</label></div>
        <div class="stat-card"><span id="stat-products">0</span><label>商品数</label></div>
        <div class="stat-card"><span id="stat-orders">0</span><label>总订单</label></div>
        <div class="stat-card"><span id="stat-revenue">$0</span><label>总收入(金币)</label></div>
      </div>
      <h3 style="margin-top:24px">最近订单</h3>
      <div id="recent-orders"><div class="empty">加载中...</div></div>
    </section>

    <!-- Tab: 商品管理 -->
    <section id="tab-products" class="tab-panel">
      <div class="admin-layout">
        <div class="admin-form">
          <h3 id="form-title">上架新商品</h3>
          <label>商品名称</label>
          <input id="f-name" placeholder="如 iPhone 16 Pro">
          <label>商品类别</label>
          <select id="f-category"></select>
          <div id="sku-readonly" style="display:none;margin:4px 0 8px;font-size:13px;color:var(--muted)">
            商品编号：<b id="sku-value" style="color:var(--brand)"></b>（系统生成，不可修改）
          </div>
          <div class="two-col">
            <div><label>每份金额（$ 美元）</label><input id="f-price" type="number" min="0.01" step="0.01" placeholder="1"></div>
            <div><label>总份数</label><input id="f-total" type="number" min="1" step="1" placeholder="999"></div>
          </div>
          <div id="multiplier-row" style="display:none;margin:8px 0;padding:10px;background:#fff7f2;border-radius:8px;font-size:13px">
            <span>商品原价 <b id="base-price">0</b> 美元</span>
            <div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <label style="margin:0">倍数</label>
              <input id="f-multiplier" type="number" min="0.1" max="10" step="0.1" value="1.5" style="width:70px;padding:4px 6px;border:1px solid #ddd;border-radius:4px">
              <label style="margin:0">÷ 每份</label>
              <input id="f-per-share" type="number" min="0.1" step="0.1" value="1" style="width:70px;padding:4px 6px;border:1px solid #ddd;border-radius:4px">
              <label style="margin:0">美元</label>
              <button type="button" class="btn sm ghost" onclick="applyMultiplier()">计算</button>
              <span id="multi-result" style="color:var(--brand);font-weight:600"></span>
            </div>
          </div>
          <div class="two-col">
            <div><label>免费金币额度（商品总额）</label><input id="f-free" type="number" min="0" step="1" placeholder="0" value="0"></div>
            <div><label>期号</label><input id="f-period" placeholder="第 001 期"></div>
          </div>
          <label>图标（emoji）</label>
          <input id="f-img" placeholder="📱">
          <label>商品描述</label>
          <textarea id="f-desc" rows="3" placeholder="商品说明、揭晓规则等"></textarea>
          <div class="amz-import">
            <label>商品来源链接（赛盈 / Doba / 亚马逊）</label>
            <div class="amz-row">
              <input id="f-source" placeholder="粘贴 saleyee / doba / amazon 商品链接">
              <button type="button" class="btn ghost" id="amz-btn" onclick="importProduct()">自动导入</button>
            </div>
            <div class="amz-hint">粘贴商品链接，自动获取名称、图片、规格</div>
          </div>
          <label>详情图片 / 视频（每行一个 URL）</label>
          <textarea id="f-gallery" rows="4" placeholder="https://.../main.jpg&#10;https://.../detail1.jpg"></textarea>
          <label>规格参数（每行 键=值）</label>
          <textarea id="f-specs" rows="3" placeholder="品牌=Anker&#10;颜色=黑色"></textarea>
          <button class="btn block" onclick="save()">保存</button>
          <button class="btn ghost block" id="cancel-edit" style="margin-top:8px;display:none" onclick="cancelEdit()">取消编辑</button>
        </div>
        <div class="admin-list-wrap">
          <h3>已上架商品</h3>
          <div id="admin-list"></div>
        </div>
      </div>
    </section>

    <!-- Tab: 用户管理 -->
    <section id="tab-users" class="tab-panel">
      <div class="user-toolbar">
        <input id="user-search" placeholder="搜索账号 / 名称" oninput="searchUsers()">
        <span id="user-count" class="muted"></span>
      </div>
      <div id="user-list"><div class="empty">加载中...</div></div>
    </section>

    <!-- Tab: 晒单审核 -->
    <section id="tab-showcase" class="tab-panel">
      <div id="showcase-pending"><div class="empty">加载中...</div></div>
    </section>

    <!-- Tab: 中奖订单 -->
    <section id="tab-wins" class="tab-panel">
      <div id="wins-list"><div class="empty">加载中...</div></div>
    </section>

    <!-- Tab: 系统设置 -->
    <section id="tab-settings" class="tab-panel">
      <div class="settings-section">
        <h3>商品类别</h3>
        <div id="cat-list" class="cat-list"></div>
        <div class="cat-add">
          <input id="cat-name" placeholder="类别名称">
          <input id="cat-prefix" placeholder="前缀(如 PH)" maxlength="4" style="width:80px">
          <input id="cat-icon" placeholder="图标" style="width:60px" value="🏷️">
          <button class="btn sm" onclick="addCat()">添加</button>
        </div>
      </div>
      <div class="settings-section">
        <h3>免费金币规则</h3>
        <div class="rules-grid">
          <label>注册奖励</label><input id="r-register" type="number" min="0">
          <label>每日签到</label><input id="r-checkin" type="number" min="0">
          <label>晒单奖励</label><input id="r-showcase" type="number" min="0">
          <label>邀请新用户（被邀请人）</label><input id="r-invitee" type="number" min="0">
          <label>邀请新用户（邀请人）</label><input id="r-inviter" type="number" min="0">
        </div>
        <button class="btn" style="margin-top:12px" onclick="saveRules()">保存规则</button>
      </div>
      <div class="settings-section">
        <h3>首页展示时间窗口</h3>
        <p style="font-size:13px;color:#666;margin-bottom:8px">设置首页各区块展示多少小时内的信息（0 = 不限制，显示全部）</p>
        <div class="rules-grid">
          <label>实时抢购动态</label><input id="r-recentBuysHours" type="number" min="0" placeholder="小时">
          <label>幸运榜（跑马灯）</label><input id="r-winnersHours" type="number" min="0" placeholder="小时">
          <label>幸运晒单</label><input id="r-showcaseHours" type="number" min="0" placeholder="小时">
        </div>
        <button class="btn" style="margin-top:12px" onclick="saveDisplayHours()">保存展示时间</button>
      </div>
      <div class="settings-section">
        <h3>开奖倒计时</h3>
        <p style="font-size:13px;color:#666;margin-bottom:8px">商品售罄后等待多少分钟再开奖（默认 10 分钟）</p>
        <div class="rules-grid">
          <label>开奖延迟（分钟）</label><input id="r-drawDelay" type="number" min="1" max="60" placeholder="10">
        </div>
        <button class="btn" style="margin-top:12px" onclick="saveDrawDelay()">保存</button>
      </div>
      <div class="settings-section">
        <h3>充值套餐</h3>
        <div id="pkg-list"></div>
        <div class="pkg-add">
          <input id="pkg-pay" type="number" placeholder="充值金额($)" min="1" step="1">
          <input id="pkg-bonus" type="number" placeholder="送免费金币" min="0" step="1" value="0">
          <button class="btn sm" onclick="addPkg()">添加</button>
        </div>
        <button class="btn ghost" style="margin-top:8px" onclick="savePkgs()">保存套餐</button>
      </div>
    </section>
  </main>
  <script src="js/common.js?v=26"></script>
  <script src="js/store.js?v=26"></script>
  <script src="js/admin.js?v=26"></script>
</body>
</html>
