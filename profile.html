<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人中心 · 幸运购</title>
  <link rel="stylesheet" href="css/style.css?v=12">
  <style>
    .profile-wrap { max-width:800px; margin:24px auto; padding:0 16px }
    .profile-card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.06); margin-bottom:24px }
    .profile-card h2 { margin:0 0 16px; font-size:18px }
    .balance-row { display:flex; gap:24px; margin-bottom:16px; flex-wrap:wrap }
    .balance-item { background:linear-gradient(135deg,#fff7f2,#fff); border:1px solid #ffe5d0; border-radius:12px; padding:16px 24px; text-align:center }
    .balance-item .num { font-size:28px; font-weight:700; color:var(--brand) }
    .balance-item .lbl { font-size:13px; color:#888; margin-top:4px }
    .win-list { display:flex; flex-direction:column; gap:12px }
    .win-item { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#f8f9fa; border-radius:10px }
    .win-item .emoji { font-size:28px }
    .win-item .info { flex:1 }
    .win-item .info .name { font-weight:600 }
    .win-item .info .date { font-size:12px; color:#aaa; margin-top:2px }
    .win-item .actions { flex:none }
    .sc-form { display:flex; flex-direction:column; gap:12px; margin-top:12px }
    .sc-form select, .sc-form input, .sc-form textarea { padding:8px 12px; border:1px solid #e0e0e0; border-radius:8px; font-size:14px }
    .sc-form textarea { resize:vertical; min-height:60px }
    .my-showcases { display:flex; flex-direction:column; gap:10px; margin-top:12px }
    .sc-item { display:flex; gap:12px; align-items:center; padding:12px; background:#f8f9fa; border-radius:10px }
    .sc-item img, .sc-item video { width:80px; height:60px; object-fit:cover; border-radius:8px }
    .sc-status { font-size:12px; padding:2px 8px; border-radius:4px; font-weight:600 }
    .sc-status.pending { background:#fff3cd; color:#856404 }
    .sc-status.approved { background:#d4edda; color:#155724 }
    .sc-status.rejected { background:#f8d7da; color:#721c24 }
    .empty { text-align:center; color:#aaa; padding:32px }
    .profile-header { display:flex; align-items:center }
    .profile-avatar { font-size:40px; width:56px; height:56px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#fff3e8,#ffe0c8); border-radius:50% }
    .profile-name { font-size:18px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .profile-account { font-size:13px; color:#888; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  </style>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <div class="profile-wrap">
    <div class="profile-card checkin-card" id="checkin-card">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <div style="font-size:36px">📅</div>
        <div style="flex:1">
          <h2 style="margin:0 0 4px">每日签到</h2>
          <div style="font-size:13px;color:#888" id="checkin-info">每日签到领取免费金币，连续签到奖励更丰厚</div>
        </div>
        <button class="btn" id="checkin-btn" onclick="doCheckin()" style="font-size:16px;padding:12px 28px">签到领币</button>
      </div>
    </div>

    <div class="profile-card">
      <h2>我的账户</h2>
      <div class="balance-row">
        <div class="balance-item"><div class="num" id="p-coins">0</div><div class="lbl">金币余额</div></div>
        <div class="balance-item"><div class="num" id="p-orders">0</div><div class="lbl">参与次数</div></div>
        <div class="balance-item"><div class="num" id="p-wins">0</div><div class="lbl">幸运次数</div></div>
      </div>
    </div>

    <div class="profile-card">
      <h2>我的幸运记录</h2>
      <div id="win-list" class="win-list"><div class="empty">加载中...</div></div>
    </div>

    <div class="profile-card">
      <h2>提交晒单</h2>
      <p style="font-size:13px;color:#888;margin:0 0 8px">幸运中选后收到商品，上传图片/视频，审核通过可获奖励金币</p>
      <div class="sc-form">
        <select id="sc-product"><option value="">选择幸运商品</option></select>
        <select id="sc-type">
          <option value="image">图片</option>
          <option value="video">视频</option>
        </select>
        <input id="sc-url" placeholder="图片或视频链接（支持图床 / 视频外链）">
        <textarea id="sc-caption" placeholder="说点什么（可选）"></textarea>
        <button class="btn" onclick="submitSC()">提交晒单</button>
      </div>
    </div>

    <div class="profile-card">
      <h2>我的晒单</h2>
      <div id="my-showcases" class="my-showcases"><div class="empty">暂无晒单</div></div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/store.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
