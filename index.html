<!DOCTYPE html>

  <link rel="stylesheet" href="css/style.css?v=20261112draworange">
  <style>
    @media (max-width:600px) {
      .home-page .trust-banner > span:not(.trust-icon) { white-space:normal; overflow:visible; line-height:1.6; }
    }
    /* 默认状态：已登录（假设用户已登录，避免闪烁） */
    .nav-profile, .nav-admin { display: inline-block; }
    #topbar-wallet, #topbar-user { display: inline-block; }
    #topbar-login { display: none; }

    /* 未登录状态：由 JS 添加 not-logged-in 类来切换 */
    html.not-logged-in .nav-profile,
    html.not-logged-in .nav-admin { display: none; }
    html.not-logged-in #topbar-wallet,
    html.not-logged-in #topbar-user { display: none; }
    html.not-logged-in #topbar-login { display: inline-block; }

    /* 管理员状态：显示后台按钮 */
    html.user-is-admin .nav-admin { display: inline-block; }
  </style>
</head>
